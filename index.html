<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Todo App</h1>

    <!-- Add row -->
    <div class="add-row">
      <input type="text" id="todo-input" placeholder="What needs doing?">
      <button id="add-btn">Add</button>
    </div>

    <!-- Tip + filter buttons -->
    <div class="toolbar">
      <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- The todos get added here by JavaScript -->
    <ul id="todo-list"></ul>

    <!-- Footer -->
    <div class="footer">
      <span id="count">0 items left</span>
      <div class="footer-buttons">
        <button id="clear-completed">Clear completed</button>
        <button id="clear-all">Clear all</button>
      </div>
    </div>
  </div>

  <!-- The browser runs JS, not TS. So we load the compiled script.js -->
  <script src="script.js"></script>
</body>
</html>
